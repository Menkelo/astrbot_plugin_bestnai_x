<!doctype html>
<html lang="zh-CN" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BestNAI 项目工作台</title>
    <link rel="stylesheet" href="./manager.css" />
    <script src="./vendor/lucide.js"></script>
  </head>
  <body>
    <div id="workspace" class="workspace">
      <main class="ws-main">
        <div class="ws-topbar">
          <div class="ws-topbar-left">
            <button id="projectMenuBtn" class="ws-project-trigger" type="button" aria-haspopup="true" aria-expanded="false">
              <i data-lucide="folder"></i>
              <span id="boardProjectName" class="ws-board-name">默认项目</span>
              <i class="ws-project-chevron" data-lucide="chevron-down"></i>
              <span id="boardCanvasCount" class="ws-board-count">0</span>
            </button>
            <aside id="sidebar" class="ws-sidebar" aria-label="项目菜单">
              <div class="ws-side-head">
                <div class="ws-side-title">项目</div>
                <button id="newProjectBtn" class="ws-side-add" type="button" title="新建项目" aria-label="新建项目">
                  <i data-lucide="plus"></i>
                </button>
              </div>
              <div id="newProjectRow" class="ws-newproj-row">
                <input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="项目名称" />
                <button id="newProjectConfirm" class="ws-mini-btn primary" type="button" title="确定" aria-label="确定"><i data-lucide="check"></i></button>
                <button id="newProjectCancel" class="ws-mini-btn" type="button" title="取消" aria-label="取消"><i data-lucide="x"></i></button>
              </div>
              <div id="projectList" class="ws-project-list"></div>
              <div class="ws-side-foot">
                <button id="trashEntry" class="ws-trash-entry" type="button">
                  <i data-lucide="trash-2"></i><span class="ws-trash-label">回收站</span>
                </button>
              </div>
            </aside>
          </div>
          <div class="ws-topbar-right">
            <button id="pasteCanvasBtn" class="ws-paste-btn" type="button" title="粘贴到此项目" hidden><i data-lucide="clipboard-paste"></i><span>粘贴到此项目</span></button>
            <button id="trashQuickBtn" class="ws-icon-btn" type="button" title="回收站" aria-label="回收站"><i data-lucide="archive"></i><span id="trashBadge" class="ws-trash-badge">0</span></button>
            <button id="boardResetView" class="ws-icon-btn" type="button" title="重置视图" aria-label="重置视图"><i data-lucide="locate-fixed"></i></button>
            <button id="boardRefresh" class="ws-icon-btn" type="button" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button>
          </div>
        </div>

        <div id="board" class="ws-board">
          <div id="boardWorld" class="ws-board-world"></div>
          <div id="boardEmptyHint" class="ws-board-empty">
            <div class="ws-board-empty-icon"><i data-lucide="mouse-pointer-click"></i></div>
            <div class="ws-board-empty-text">暂无画布</div>
            <div class="ws-board-empty-sub">双击空白处创建画布</div>
          </div>
        </div>

        <div id="trashPanel" class="ws-trash-panel">
          <div class="ws-trash-head">
            <div class="ws-trash-head-title"><i data-lucide="trash-2"></i><span>回收站</span></div>
            <button id="trashClose" class="ws-icon-btn" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
          </div>
          <div class="ws-trash-note"><i data-lucide="info"></i><span>回收站中的画布会保留，直到手动彻底删除。</span></div>
          <div id="trashList" class="ws-trash-list"></div>
        </div>
        <div id="boardStatus" class="ws-status"></div>
      </main>
    </div>
    <script src="./manager.js"></script>
  </body>
</html>
