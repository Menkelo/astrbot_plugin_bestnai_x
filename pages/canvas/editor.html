<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BestNAI 无限画布</title>
    <link rel="stylesheet" href="./canvas.css" />
    <script src="./vendor/lucide.js"></script>
  </head>
  <body>
    <div id="shell" class="shell">
      <div class="topbar panel">
        <section class="canvas-nav" aria-label="画布状态">
          <span class="canvas-mark" aria-hidden="true"><img src="./plugin-logo.webp" alt="" /></span>
          <div class="canvas-nav-meta">
            <span class="plugin-title-row">
              <strong class="current-canvas-title" id="pluginDisplayName">NAI Diffusion X</strong>
            </span>
            <span class="plugin-meta">
              <span class="plugin-author">by <span id="pluginAuthor">Menkelo</span></span>
              <span id="pluginVersion">v3.0.38</span>
              <span id="connectionIndicator" class="connection-indicator checking" role="status" aria-label="正在检测服务连接" title="正在检测服务连接"></span>
            </span>
          </div>
        </section>

        <nav id="quickToolbar" class="toolbar" aria-label="画布工具">
          <div class="toolbar-items">
            <button class="tool-btn" id="addImageBtn" type="button" title="上传图片">
              <i data-lucide="image-plus"></i><span>图片</span>
            </button>
            <button class="tool-btn" id="addPromptBtn" type="button" title="添加提示词节点">
              <i data-lucide="text-cursor-input"></i><span>提示词</span>
            </button>
            <button class="tool-btn" id="addNoteBtn" type="button" title="添加备注节点">
              <i data-lucide="notebook-pen"></i><span>备注</span>
            </button>
            <button class="tool-btn" id="assetLibraryBtn" type="button" title="素材库">
              <i data-lucide="library"></i><span>素材库</span>
            </button>
          </div>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <div class="toolbar-fixed">
            <button class="tool-btn icon-only" id="undoBtn" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销">
              <i data-lucide="undo-2"></i>
            </button>
            <button class="tool-btn icon-only" id="redoBtn" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
              <i data-lucide="redo-2"></i>
            </button>
            <button class="tool-btn icon-only" id="fitBtn" type="button" title="适配全部节点 (Ctrl+0)" aria-label="适配全部节点">
              <i data-lucide="scan"></i>
            </button>
            <button class="tool-btn icon-only" id="importBtn" type="button" title="导入工作区" aria-label="导入工作区">
              <i data-lucide="upload"></i>
            </button>
            <button class="tool-btn icon-only" id="exportBtn" type="button" title="导出工作区" aria-label="导出工作区">
              <i data-lucide="download"></i>
            </button>
            <button class="tool-btn icon-only danger" id="clearBtn" type="button" title="清空画布" aria-label="清空画布">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </nav>
        <div class="mobile-asset-library-switcher">
          <button id="mobileAssetLibraryBtn" class="tool-btn icon-only mobile-asset-library-trigger" type="button" title="素材库" aria-label="素材库" aria-controls="assetPanel" aria-expanded="false">
            <i data-lucide="library"></i>
          </button>
        </div>
        <div class="project-switcher toolbar-project-switcher">
          <button id="projectMenuBtn" class="tool-btn icon-only project-menu-trigger" type="button" title="管理项目" aria-label="管理项目" aria-haspopup="true" aria-controls="projectMenu" aria-expanded="false"><i data-lucide="folder"></i></button>
        </div>
      </div>

      <main id="board" class="board" aria-label="无限画布">
        <div id="dropOverlay" class="drop-overlay">
          <i data-lucide="image-down"></i>
          <strong>拖放图片到画布</strong>
        </div>
        <div id="selectionBox" class="selection-box"></div>
        <div id="world" class="world">
          <svg id="links" class="links" aria-label="节点连线"></svg>
          <div id="linkControls" class="link-controls"></div>
          <div id="nodes"></div>
        </div>

        <div id="emptyState" class="empty-state">
          <i data-lucide="mouse-pointer-2"></i>
          <strong class="empty-state-desktop">右键添加节点</strong>
          <span class="empty-state-desktop">双击空白处可快速创建提示词</span>
          <strong class="empty-state-mobile">从顶部工具栏添加节点</strong>
          <span class="empty-state-mobile">素材图片可预览后放入画布</span>
        </div>

        <button id="canvasArrangeBtn" class="minimap-arrange-btn" type="button" title="整理选中节点" aria-label="整理选中节点">
          <i data-lucide="layout-grid"></i><span>整理选中</span>
        </button>
        <div id="minimap" class="minimap" tabindex="0" role="application" aria-label="画布导航小地图" title="拖动定位画布">
          <div id="minimapContent" class="minimap-content">
            <div id="minimapViewport" class="minimap-viewport"></div>
          </div>
        </div>
        <aside id="assetPanel" class="asset-panel" aria-label="素材库">
          <div id="assetGrid" class="asset-grid"></div>
          <div id="assetEmpty" class="asset-empty"><i data-lucide="library"></i><span>暂无图片素材</span></div>
          <div class="asset-delete-toolbar">
            <span id="assetLibraryCount" class="asset-library-count">已收录 0 张</span>
            <div id="assetDeleteActions" class="asset-delete-actions" hidden>
              <span id="assetDeleteCount">已选 0 项</span>
              <button id="assetDeleteConfirm" class="asset-delete-confirm" type="button" disabled><i data-lucide="trash-2"></i><span>删除</span></button>
              <button id="assetDeleteCancel" class="asset-delete-cancel" type="button"><i data-lucide="x"></i><span>取消</span></button>
            </div>
            <button id="assetSelectModeBtn" class="asset-select-mode-btn" type="button" aria-pressed="false" title="批量选择素材"><i data-lucide="list-checks"></i><span>多选</span></button>
          </div>
        </aside>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="projectMenu" class="project-menu" hidden>
      <header class="project-menu-head">
        <strong>项目</strong>
        <button id="newProjectBtn" class="project-menu-icon" type="button" title="新建项目" aria-label="新建项目"><i data-lucide="plus"></i></button>
      </header>
      <div id="newProjectRow" class="project-create-row" hidden>
        <input id="newProjectInput" type="text" maxlength="120" placeholder="项目名称" />
        <button id="confirmNewProjectBtn" class="project-menu-icon primary" type="button" title="创建" aria-label="创建"><i data-lucide="check"></i></button>
        <button id="cancelNewProjectBtn" class="project-menu-icon" type="button" title="取消" aria-label="取消"><i data-lucide="x"></i></button>
      </div>
      <div id="projectList" class="project-list"></div>
    </div>
    <div id="canvasContextMenu" class="canvas-context-menu" role="menu" aria-label="添加节点" hidden>
      <button id="contextAddImageBtn" type="button" role="menuitem"><i data-lucide="image-plus"></i><span>图片</span></button>
      <button id="contextAddPromptBtn" type="button" role="menuitem"><i data-lucide="text-cursor-input"></i><span>提示词</span></button>
      <button id="contextAddNoteBtn" type="button" role="menuitem"><i data-lucide="notebook-pen"></i><span>备注</span></button>
    </div>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
    <input id="workspaceInput" type="file" accept="application/json,.json" hidden />

    <div id="clearModal" class="modal-backdrop" hidden>
      <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="clearModalTitle">
        <div class="dialog-icon"><i data-lucide="trash-2"></i></div>
        <h2 id="clearModalTitle">清空画布</h2>
        <p>全部节点和连线会从工作区移除，已经存储的图片文件会保留。</p>
        <div class="dialog-actions">
          <button class="dialog-btn secondary" type="button" id="cancelClearBtn">取消</button>
          <button class="dialog-btn danger" type="button" id="confirmClearBtn">清空</button>
        </div>
      </section>
    </div>

    <div id="imageViewer" class="image-viewer" role="dialog" aria-modal="true" aria-label="图片预览" tabindex="-1" hidden>
      <figure class="image-viewer-stage">
        <img id="imageViewerImage" alt="" />
        <figcaption class="image-viewer-details">
          <div id="imageViewerPromptSection" class="image-viewer-copy">
            <div class="image-viewer-copy-head"><span>提示词</span><button type="button" class="image-viewer-copy-btn" data-copy-target="imageViewerPrompt" title="复制提示词" aria-label="复制提示词"><i data-lucide="copy"></i></button></div>
            <p id="imageViewerPrompt" class="image-viewer-copy-text">暂无提示词记录</p>
          </div>
          <div class="image-viewer-copy">
            <div class="image-viewer-copy-head"><span>英文 tags</span><button type="button" class="image-viewer-copy-btn" data-copy-target="imageViewerTags" title="复制英文 tags" aria-label="复制英文 tags"><i data-lucide="copy"></i></button></div>
            <p id="imageViewerTags" class="image-viewer-copy-text">暂无英文 tags 记录</p>
          </div>
          <button id="imageViewerPlaceBtn" class="image-viewer-place-btn" type="button" hidden><i data-lucide="plus"></i><span>放入画布</span></button>
        </figcaption>
      </figure>
    </div>

    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script type="module" src="./canvas.js"></script>
  </body>
</html>
