<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BestNAI 无限画布</title>
    <link rel="stylesheet" href="./canvas.css" />
    <script src="./vendor/lucide.js"></script>
  </head>
  <body>
    <div id="shell" class="shell">
      <div class="topbar panel">
        <section class="canvas-nav" aria-label="画布状态">
          <span class="canvas-mark" aria-hidden="true"><img src="./plugin-logo.webp" alt="" /></span>
          <div class="canvas-nav-meta">
            <span class="plugin-title-row">
              <strong class="current-canvas-title" id="pluginDisplayName">NAI Diffusion X</strong>
            </span>
            <span class="plugin-meta">
              <span class="plugin-author">by <span id="pluginAuthor">Menkelo</span></span>
              <span id="pluginVersion" hidden></span>
              <span id="connectionIndicator" class="connection-indicator checking" role="status" aria-label="正在检测服务连接" title="正在检测服务连接"></span>
            </span>
          </div>
        </section>

        <nav id="quickToolbar" class="toolbar" aria-label="画布工具">
          <div class="toolbar-items toolbar-create-tools" aria-label="创建节点">
            <button class="tool-btn icon-only" id="addImageBtn" type="button" title="上传图片" aria-label="上传图片">
              <i data-lucide="image-plus"></i>
            </button>
            <button class="tool-btn icon-only" id="addPromptBtn" type="button" title="添加提示词节点" aria-label="添加提示词节点">
              <i data-lucide="text-cursor-input"></i>
            </button>
            <button class="tool-btn icon-only" id="addNoteBtn" type="button" title="添加备注节点" aria-label="添加备注节点">
              <i data-lucide="notebook-pen"></i>
            </button>
          </div>
          <div class="toolbar-fixed">
            <div class="toolbar-group toolbar-history-group" aria-label="历史与视图">
              <button class="tool-btn icon-only" id="undoBtn" type="button" title="撤销 (Ctrl+Z)" aria-label="撤销">
                <i data-lucide="undo-2"></i>
              </button>
              <button class="tool-btn icon-only" id="redoBtn" type="button" title="重做 (Ctrl+Shift+Z)" aria-label="重做">
                <i data-lucide="redo-2"></i>
              </button>
              <button class="tool-btn icon-only" id="fitBtn" type="button" title="适配全部节点 (Ctrl+0)" aria-label="适配全部节点">
                <i data-lucide="scan"></i>
              </button>
            </div>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <div class="toolbar-group toolbar-workspace-group" aria-label="素材与工作区">
              <button class="tool-btn icon-only" id="assetLibraryBtn" type="button" title="素材库" aria-label="素材库" aria-controls="assetPanel" aria-expanded="false">
                <i data-lucide="images"></i>
              </button>
              <button class="tool-btn icon-only" id="importBtn" type="button" title="导入工作区" aria-label="导入工作区">
                <i data-lucide="upload"></i>
              </button>
              <button class="tool-btn icon-only" id="exportBtn" type="button" title="导出工作区" aria-label="导出工作区">
                <i data-lucide="download"></i>
              </button>
            </div>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <div class="toolbar-group toolbar-system-group" aria-label="调试与清理">
              <button class="tool-btn icon-only" id="debugModeBtn" type="button" title="详细调试模式" aria-label="详细调试模式" aria-pressed="false">
                <i data-lucide="bug"></i>
              </button>
              <button class="tool-btn icon-only danger" id="clearBtn" type="button" title="清空画布" aria-label="清空画布">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
        </nav>
        <div class="mobile-asset-library-switcher">
          <button id="mobileAssetLibraryBtn" class="tool-btn icon-only mobile-asset-library-trigger" type="button" title="素材库" aria-label="素材库" aria-controls="assetPanel" aria-expanded="false">
            <i data-lucide="images"></i>
          </button>
        </div>
        <div class="project-switcher toolbar-project-switcher">
          <button id="projectMenuBtn" class="tool-btn icon-only project-menu-trigger" type="button" title="管理项目" aria-label="管理项目" aria-haspopup="true" aria-controls="projectMenu" aria-expanded="false"><i data-lucide="folder"></i></button>
        </div>
      </div>

      <main id="board" class="board" tabindex="-1" aria-label="无限画布">
        <div id="dropOverlay" class="drop-overlay">
          <i data-lucide="image-down"></i>
          <strong>拖放图片到画布</strong>
        </div>
        <div id="selectionBox" class="selection-box"></div>
        <div id="world" class="world">
          <svg id="links" class="links" aria-label="节点连线"></svg>
          <div id="linkControls" class="link-controls"></div>
          <div id="nodes"></div>
        </div>

        <div id="emptyState" class="empty-state">
          <i data-lucide="mouse-pointer-2"></i>
          <strong class="empty-state-desktop">右键添加节点</strong>
          <span class="empty-state-desktop">双击空白处可快速创建提示词</span>
          <strong class="empty-state-mobile">从顶部工具栏添加节点</strong>
          <span class="empty-state-mobile">素材图片可预览后放入画布</span>
        </div>

        <button id="canvasArrangeBtn" class="arrange-selection-btn" type="button" title="整理选中节点" aria-label="整理选中节点">
          <i data-lucide="layout-grid"></i><span>整理选中</span>
        </button>
        <aside id="debugBar" class="debug-bar" aria-label="操作记录">
          <div class="debug-bar-head">
            <button id="debugBarToggle" class="debug-bar-toggle" type="button" aria-expanded="false" aria-controls="debugBarBody" aria-label="展开操作记录">
              <i data-lucide="terminal"></i><span id="debugBarSummary">操作记录 · 就绪</span><i data-lucide="chevron-up" class="debug-bar-chevron"></i>
            </button>
            <button id="debugLogClearBtn" class="debug-bar-action icon-only" type="button" title="清空操作记录" aria-label="清空操作记录">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <div id="debugBarBody" class="debug-bar-body"></div>
        </aside>
        <aside id="assetPanel" class="asset-panel" aria-label="素材库">
          <header class="asset-panel-head">
            <div class="asset-panel-title-group">
              <div class="asset-panel-title"><i data-lucide="library"></i><strong>素材库 / Library</strong></div>
              <span class="asset-panel-subtitle">点击素材预览</span>
            </div>
            <div class="asset-panel-head-actions">
              <span id="assetLibraryCount" class="asset-library-count">已收录 0 张</span>
              <button id="assetRefreshBtn" class="asset-panel-icon-btn" type="button" title="刷新素材库" aria-label="刷新素材库"><i data-lucide="refresh-cw"></i></button>
            </div>
          </header>
          <div class="asset-library-modes" role="tablist" aria-label="素材库视图">
            <button id="assetViewAllBtn" class="asset-library-mode active" type="button" role="tab" aria-selected="true" data-library-view="all"><i data-lucide="layers-3"></i><span>全部</span><b id="assetAllCount">0</b></button>
            <button id="assetViewRecentBtn" class="asset-library-mode" type="button" role="tab" aria-selected="false" data-library-view="recent"><i data-lucide="history"></i><span>最近</span><b id="assetRecentCount">0</b></button>
            <button id="assetStackTrail" class="asset-stack-trail" type="button" hidden><i data-lucide="arrow-left"></i><span id="assetStackTrailLabel">返回全部素材</span></button>
          </div>
          <div id="assetGrid" class="asset-grid"></div>
          <div id="assetEmpty" class="asset-empty"><i data-lucide="library"></i><span>暂无图片素材</span></div>
          <footer class="asset-panel-foot">
            <span class="asset-panel-foot-hint">点击唱片堆展开 · 点击图片预览</span>
            <div class="asset-delete-toolbar">
              <div id="assetDeleteActions" class="asset-delete-actions" hidden>
                <span id="assetDeleteCount">已选 0 项</span>
                <div class="asset-delete-buttons">
                  <button id="assetPlaceSelectedBtn" class="asset-place-selected" type="button" disabled><i data-lucide="layout-grid"></i><span>加入画布</span></button>
                  <button id="assetArchiveSelectedBtn" class="asset-archive-selected" type="button" disabled><i data-lucide="archive"></i><span>压缩</span></button>
                  <button id="assetDeleteConfirm" class="asset-delete-confirm" type="button" disabled><i data-lucide="trash-2"></i><span>删除</span></button>
                  <button id="assetDeleteCancel" class="asset-delete-cancel" type="button"><i data-lucide="x"></i><span>取消</span></button>
                </div>
              </div>
              <button id="assetSelectModeBtn" class="asset-select-mode-btn" type="button" aria-pressed="false" title="批量选择素材"><i data-lucide="list-checks"></i><span>多选</span></button>
            </div>
          </footer>
        </aside>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="projectMenu" class="project-menu" hidden>
      <header class="project-menu-head">
        <strong>项目</strong>
        <button id="newProjectBtn" class="project-menu-icon" type="button" title="新建项目" aria-label="新建项目"><i data-lucide="plus"></i></button>
      </header>
      <div id="newProjectRow" class="project-create-row" hidden>
        <input id="newProjectInput" type="text" maxlength="120" placeholder="项目名称" />
        <button id="confirmNewProjectBtn" class="project-menu-icon primary" type="button" title="创建" aria-label="创建"><i data-lucide="check"></i></button>
        <button id="cancelNewProjectBtn" class="project-menu-icon" type="button" title="取消" aria-label="取消"><i data-lucide="x"></i></button>
      </div>
      <div id="projectList" class="project-list"></div>
    </div>
    <div id="canvasContextMenu" class="canvas-context-menu" role="menu" aria-label="添加节点" hidden>
      <button id="contextAddImageBtn" type="button" role="menuitem"><i data-lucide="image-plus"></i><span>图片</span></button>
      <button id="contextAddPromptBtn" type="button" role="menuitem"><i data-lucide="text-cursor-input"></i><span>提示词</span></button>
      <button id="contextAddNoteBtn" type="button" role="menuitem"><i data-lucide="notebook-pen"></i><span>备注</span></button>
    </div>
    <div id="nodeContextMenu" class="canvas-context-menu node-context-menu" role="menu" aria-label="节点操作" hidden>
      <button id="nodeContextSaveImage" type="button" role="menuitem" data-image-only hidden><i data-lucide="bookmark-plus"></i><span>收录到素材库</span></button>
      <button id="nodeContextDownloadImage" type="button" role="menuitem" data-image-only hidden><i data-lucide="download"></i><span>下载图片</span></button>
      <button id="nodeContextDuplicate" type="button" role="menuitem"><i data-lucide="copy"></i><span>复制节点</span></button>
      <button id="nodeContextDelete" class="danger" type="button" role="menuitem"><i data-lucide="trash-2"></i><span>删除节点</span></button>
    </div>
    <div id="selectionContextMenu" class="canvas-context-menu selection-context-menu" role="menu" aria-label="多选节点操作" hidden>
      <button id="selectionContextArrange" type="button" role="menuitem"><i data-lucide="layout-grid"></i><span>整理选中</span></button>
      <button id="selectionContextDelete" class="danger" type="button" role="menuitem"><i data-lucide="trash-2"></i><span>删除选中</span></button>
    </div>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
    <input id="workspaceInput" type="file" accept="application/json,.json" hidden />

    <div id="clearModal" class="modal-backdrop" hidden>
      <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="clearModalTitle">
        <div class="dialog-icon"><i data-lucide="trash-2"></i></div>
        <h2 id="clearModalTitle">清空画布</h2>
        <p>全部节点和连线会从工作区移除，已经存储的图片文件会保留。</p>
        <div class="dialog-actions">
          <button class="dialog-btn danger" type="button" id="confirmClearBtn">清空</button>
          <button class="dialog-btn secondary" type="button" id="cancelClearBtn">取消</button>
        </div>
      </section>
    </div>

    <div id="assetDeleteModal" class="modal-backdrop" hidden>
      <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="assetDeleteModalTitle" aria-describedby="assetDeleteModalText">
        <div class="dialog-icon"><i data-lucide="trash-2"></i></div>
        <h2 id="assetDeleteModalTitle">删除所选素材？</h2>
        <p id="assetDeleteModalText">所选素材会从素材库移除，此操作无法撤销。</p>
        <div class="dialog-actions">
          <button class="dialog-btn danger" type="button" id="confirmAssetDeleteBtn">删除</button>
          <button class="dialog-btn secondary" type="button" id="cancelAssetDeleteBtn">取消</button>
        </div>
      </section>
    </div>

    <div id="imageViewer" class="image-viewer layout-bottom" role="dialog" aria-modal="true" aria-label="图片预览" tabindex="-1" hidden>
      <figure class="image-viewer-stage">
        <div class="image-viewer-image-frame">
          <img id="imageViewerImage" alt="" />
          <button id="imageViewerPlaceBtn" class="image-viewer-place-btn" type="button" hidden><i data-lucide="plus"></i><span>放入画布</span></button>
        </div>
        <figcaption id="imageViewerDetails" class="image-viewer-details">
          <button id="imageViewerDetailsToggle" class="image-viewer-details-toggle" type="button" aria-expanded="true" aria-label="折叠 Prompt Tags" title="折叠 Prompt Tags"><i data-lucide="chevron-up"></i></button>
          <header class="image-viewer-header">
            <h2 id="imageViewerTitle">图片预览</h2>
            <p id="imageViewerMeta">--</p>
          </header>
          <div class="image-viewer-actions">
            <button id="imageViewerCopyAllBtn" class="image-viewer-action-btn" type="button" title="复制全部提示词"><i data-lucide="copy"></i><span>复制全部</span></button>
            <button id="imageViewerDownloadBtn" class="image-viewer-action-btn" type="button" title="下载原图"><i data-lucide="download"></i><span>下载原图</span></button>
            <button id="imageViewerRetagBtn" class="image-viewer-action-btn" type="button" title="反推此图"><i data-lucide="scan-search"></i><span>反推此图</span></button>
          </div>
          <div class="image-viewer-copy">
            <div class="image-viewer-copy-head"><span>正向 Tags</span><button type="button" class="image-viewer-copy-btn" data-copy-target="imageViewerTags" title="复制英文 Tags" aria-label="复制英文 Tags"><i data-lucide="copy"></i></button></div>
            <div id="imageViewerTags" class="image-viewer-tag-grid" role="group" aria-label="可复制的 Prompt Tags" data-copy-text=""></div>
          </div>
          <div id="imageViewerNegativeSection" class="image-viewer-copy" hidden>
            <div class="image-viewer-copy-head"><span>Negative</span><button type="button" class="image-viewer-copy-btn" data-copy-target="imageViewerNegative" title="复制负面提示词" aria-label="复制负面提示词"><i data-lucide="copy"></i></button></div>
            <div id="imageViewerNegative" class="image-viewer-note" data-copy-text=""></div>
          </div>
          <div id="imageViewerNoteSection" class="image-viewer-copy" hidden>
            <div class="image-viewer-copy-head"><span>Note</span></div>
            <div id="imageViewerNote" class="image-viewer-note"></div>
          </div>
        </figcaption>
      </figure>
    </div>

    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script type="module" src="./canvas.js"></script>
  </body>
</html>
